name: Brand inventory

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

permissions:
  contents: write
  checks: write

jobs:
  inventory:
    name: Brand inventory control
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ELF reader
        run: python -m pip install pyelftools==0.32
      - name: Test inventory
        run: python -m unittest discover -s tools/inventory -p 'test_*.py' -v
      - name: Download Toyota reference
        run: |
          mkdir -p .local/inventory/downloads .local/inventory/control
          gh release download assets-v1 --pattern TOYOTA.zip --dir .local/inventory/downloads
      - name: Run decoded Toyota control
        run: |
          python tools/inventory/toyota_control.py .local/inventory/downloads/TOYOTA.zip --output .local/inventory/control
          rm .local/inventory/downloads/TOYOTA.zip
      - name: Publish control only
        run: |
          gh release upload ci-reports-v1 .local/inventory/control/control.md .local/inventory/control/control.json --clobber
          gh api --method POST "repos/$GH_REPO/check-runs" -f name='Brand inventory control' -f "head_sha=$GITHUB_SHA" -f status=completed -f conclusion=success -f 'output[title]=Toyota decoded-BIN control' -F 'output[summary]=@.local/inventory/control/control.md'
