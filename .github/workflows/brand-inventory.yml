name: Brand inventory

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']

permissions:
  contents: write
  checks: write

jobs:
  inventory:
    name: Brand inventory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ELF reader
        run: python -m pip install pyelftools==0.32
      - name: Test inventory
        run: python -m unittest discover -s tools/inventory -p 'test_*.py' -v
      - name: Run gated decoded inventory
        id: inventory
        timeout-minutes: 35
        continue-on-error: true
        run: |
          mkdir -p .local/inventory
          set -o pipefail
          python tools/inventory/inventory4.py --output .local/inventory/report --max-seconds 1800 2>&1 | tee .local/inventory/inventory.log
      - name: Verify committed inventory against this SHA
        if: steps.inventory.outcome == 'success'
        run: python tools/inventory/verify_document.py .local/inventory/report
      - name: Publish partial or complete release reports
        if: always() && steps.inventory.outcome != 'skipped'
        run: |
          test -s .local/inventory/report/brand-inventory.md
          test -s .local/inventory/report/brand-inventory.json
          gh release upload ci-reports-v1 .local/inventory/report/brand-inventory.md .local/inventory/report/brand-inventory.json --clobber
      - name: Publish check runs
        if: always() && steps.inventory.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.inventory.outcome }}
        run: |
          test -s .local/inventory/report/parts.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = Path('.local/inventory/report')
          state = json.loads((report / 'brand-inventory.json').read_text())
          conclusion = 'success' if os.environ['OUTCOME'] == 'success' and state['control']['passed'] and not state['pending'] else 'failure'
          for part in json.loads((report / 'parts.json').read_text()):
              subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/check-runs",
                              '-f', f"name={part['name']}", '-f', f"head_sha={os.environ['GITHUB_SHA']}",
                              '-f', 'status=completed', '-f', f'conclusion={conclusion}',
                              '-f', f"output[title]={part['name']}", '-F', f"output[summary]=@{part['file']}"], check=True)
          PY
      - name: Fail if inventory failed
        if: always() && steps.inventory.outcome == 'failure'
        run: |
          cat .local/inventory/inventory.log
          exit 1

  census-control:
    name: Inventory-5 Toyota census control
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore previously generated Toyota packs
        uses: actions/cache/restore@v5
        with:
          path: .local/toyota-vehicle-packs
          key: toyota-vehicle-packs-v1-${{ runner.os }}-${{ hashFiles('tools/thinkdiag/*.py', 'tools/thinkdiag/requirements.txt', 'tools/thinkdiag/verification/*.json', 'tools/thinkdiag/schema/*') }}
      - name: Run unchanged Toyota pack census
        id: control
        run: |
          python tools/inventory/census_control.py --packs .local/toyota-vehicle-packs --output .local/inventory5-control
          echo "passed=$(python -c "import json; print(str(json.load(open('.local/inventory5-control/control-result.json'))['passed']).lower())")" >> "$GITHUB_OUTPUT"
      - name: Publish Toyota census control
        run: |
          conclusion=$(python -c "import json; print('success' if json.load(open('.local/inventory5-control/control-result.json'))['passed'] else 'neutral')")
          gh api --method POST "repos/$GH_REPO/check-runs" -f name='Inventory-5 Toyota census control' -f "head_sha=$GITHUB_SHA" -f status=completed -f "conclusion=$conclusion" -f 'output[title]=Inventory-5 Toyota census control' -F 'output[summary]=@.local/inventory5-control/control.md'
          cat .local/inventory5-control/control.md >> "$GITHUB_STEP_SUMMARY"
      - name: Install inventory reader
        if: steps.control.outputs.passed == 'true'
        run: python -m pip install pyelftools==0.32
      - name: Download complete Inventory-4 data
        if: steps.control.outputs.passed == 'true'
        run: |
          mkdir -p .local/inventory5/source .local/inventory5/downloads
          gh release download ci-reports-v1 --pattern brand-inventory.json --dir .local/inventory5/source
      - name: Census eligible brands one archive at a time
        id: brands
        if: steps.control.outputs.passed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/inventory/census_brands.py --source .local/inventory5/source/brand-inventory.json \
            --control .local/inventory5-control/control-result.json --work .local/inventory5/downloads \
            --output .local/inventory5/report 2>&1 | tee .local/inventory5/brands.log
      - name: Verify Inventory-5 document against this SHA
        if: steps.brands.outcome == 'success'
        run: python tools/inventory/verify_census_document.py .local/inventory5/report
      - name: Publish partial brand census
        if: always() && steps.brands.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.brands.outcome }}
        run: |
          test -s .local/inventory5/report/inventory5.md
          gh release upload ci-reports-v1 .local/inventory5/report/inventory5.md .local/inventory5/report/inventory5.json --clobber
          conclusion=success
          if [ "$OUTCOME" != success ]; then conclusion=failure; fi
          gh api --method POST "repos/$GH_REPO/check-runs" -f name='Inventory-5 brand census' -f "head_sha=$GITHUB_SHA" -f status=completed -f "conclusion=$conclusion" -f 'output[title]=Inventory-5 brand census' -F 'output[summary]=@.local/inventory5/report/inventory5.md'
      - name: Fail on brand census errors
        if: always() && steps.brands.outcome == 'failure'
        run: |
          cat .local/inventory5/brands.log
          exit 1

  clusters:
    name: Inventory-6 stem clusters
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install inventory reader
        run: python -m pip install pyelftools==0.32
      - name: Download complete inventory data
        run: |
          mkdir -p .local/inventory6/source .local/inventory6/downloads
          gh release download ci-reports-v1 --pattern brand-inventory.json --dir .local/inventory6/source
      - name: Cluster and profile representatives
        id: clusters
        timeout-minutes: 35
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/inventory/inventory6.py --source .local/inventory6/source/brand-inventory.json \
            --work .local/inventory6/downloads --output .local/inventory6/report 2>&1 | tee .local/inventory6/clusters.log
      - name: Verify Inventory-6 document against this SHA
        if: steps.clusters.outcome == 'success'
        run: python tools/inventory/verify_cluster_document.py .local/inventory6/report
      - name: Publish cluster reports
        if: always() && steps.clusters.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.clusters.outcome }}
        run: |
          test -s .local/inventory6/report/inventory6.md
          gh release upload ci-reports-v1 .local/inventory6/report/inventory6.md .local/inventory6/report/inventory6.json --clobber
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path('.local/inventory6/report')
          state = json.loads((path / 'inventory6.json').read_text())
          conclusion = 'success' if os.environ['OUTCOME'] == 'success' and len(state['profiles']) == len(state['representatives']) else 'failure'
          for part in json.loads((path / 'parts.json').read_text()):
              subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/check-runs",
                              '-f', f"name={part['name']}", '-f', f"head_sha={os.environ['GITHUB_SHA']}",
                              '-f', 'status=completed', '-f', f'conclusion={conclusion}',
                              '-f', f"output[title]={part['name']}", '-F', f"output[summary]=@{part['file']}"], check=True)
          PY
      - name: Fail on clustering errors
        if: always() && steps.clusters.outcome == 'failure'
        run: |
          cat .local/inventory6/clusters.log
          exit 1

  family-evidence:
    name: Inventory-7 family evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # family_evidence.py reads sweep_toyota.FOCUSED_READERS with ast, so the
      # capstone/unicorn chain is never imported and pyelftools is sufficient.
      - name: Install ELF reader
        run: python -m pip install pyelftools==0.32
      - name: Test family evidence
        run: python -m unittest discover -s tools/inventory -p 'test_family_evidence.py' -v
      - name: Run gated decoded family probe
        id: families
        timeout-minutes: 35
        continue-on-error: true
        run: |
          mkdir -p .local/inventory7
          set -o pipefail
          python tools/inventory/family_evidence.py --output .local/inventory7/report --max-seconds 1900 2>&1 | tee .local/inventory7/families.log
      - name: Verify documented summary
        id: docverify
        if: always() && steps.families.outcome == 'success' && hashFiles('.local/inventory7/report/inventory7.md') != ''
        continue-on-error: true
        run: python tools/inventory/verify_family_document.py .local/inventory7/report
      - name: Publish Inventory-7 reports
        if: always() && steps.families.outcome != 'skipped' && hashFiles('.local/inventory7/report/inventory7.md') != ''
        run: |
          test -s .local/inventory7/report/inventory7.md
          test -s .local/inventory7/report/inventory7.json
          gh release upload ci-reports-v1 .local/inventory7/report/inventory7.md .local/inventory7/report/inventory7.json --clobber
      - name: Publish check runs
        if: always() && steps.families.outcome != 'skipped' && hashFiles('.local/inventory7/report/parts.json') != ''
        env:
          OUTCOME: ${{ steps.families.outcome }}
          DOCVERIFY: ${{ steps.docverify.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = Path('.local/inventory7/report')
          state = json.loads((report / 'inventory7.json').read_text())
          conclusion = 'success' if os.environ['OUTCOME'] == 'success' and os.environ['DOCVERIFY'] == 'success' and state['control']['passed'] and not state['pending'] and not state.get('failed') else 'failure'
          for part in json.loads((report / 'parts.json').read_text()):
              subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/check-runs",
                              '-f', f"name={part['name']}", '-f', f"head_sha={os.environ['GITHUB_SHA']}",
                              '-f', 'status=completed', '-f', f'conclusion={conclusion}',
                              '-f', f"output[title]={part['name']}", '-F', f"output[summary]=@{part['file']}"], check=True)
          PY
      - name: Fail if the family probe or its documented summary failed
        if: always() && (steps.families.outcome == 'failure' || steps.docverify.outcome == 'failure')
        env:
          FAMILIES: ${{ steps.families.outcome }}
          DOCVERIFY: ${{ steps.docverify.outcome }}
        run: |
          if [ "$FAMILIES" = failure ]; then cat .local/inventory7/families.log; fi
          if [ "$DOCVERIFY" = failure ]; then echo "The committed Inventory-7 documentation summary does not match this SHA's report."; fi
          exit 1

  consumer-link:
    name: Inventory-8 consumer link
    needs: family-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # consumer_link.py imports family_evidence, which reads FOCUSED_READERS with
      # ast, so the capstone/unicorn chain is never imported here either.
      - name: Install ELF reader
        run: python -m pip install pyelftools==0.32
      - name: Test consumer link
        run: python -m unittest discover -s tools/inventory -p 'test_consumer_link.py' -v
      - name: Download Inventory-7 family evidence
        run: |
          mkdir -p .local/inventory8/in
          gh release download ci-reports-v1 --pattern inventory7.json --dir .local/inventory8/in --clobber
      - name: Run gated consumer link measurement
        id: links
        timeout-minutes: 30
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/inventory/consumer_link.py \
            --inventory7-json .local/inventory8/in/inventory7.json \
            --output .local/inventory8/report --max-seconds 1500 2>&1 | tee .local/inventory8/links.log
      - name: Publish Inventory-8 reports
        if: always() && steps.links.outcome != 'skipped' && hashFiles('.local/inventory8/report/inventory8.md') != ''
        run: |
          test -s .local/inventory8/report/inventory8.md
          test -s .local/inventory8/report/inventory8.json
          gh release upload ci-reports-v1 .local/inventory8/report/inventory8.md .local/inventory8/report/inventory8.json --clobber
      - name: Publish check runs
        if: always() && steps.links.outcome != 'skipped' && hashFiles('.local/inventory8/report/parts.json') != ''
        env:
          OUTCOME: ${{ steps.links.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = Path('.local/inventory8/report')
          state = json.loads((report / 'inventory8.json').read_text())
          conclusion = 'success' if os.environ['OUTCOME'] == 'success' and state['control']['passed'] and not state['pending'] and not state.get('failed') else 'failure'
          for part in json.loads((report / 'parts.json').read_text()):
              subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GH_REPO']}/check-runs",
                              '-f', f"name={part['name']}", '-f', f"head_sha={os.environ['GITHUB_SHA']}",
                              '-f', 'status=completed', '-f', f'conclusion={conclusion}',
                              '-f', f"output[title]={part['name']}", '-F', f"output[summary]=@{part['file']}"], check=True)
          PY
      - name: Fail if the consumer link measurement failed
        if: always() && steps.links.outcome == 'failure'
        run: |
          cat .local/inventory8/links.log
          exit 1

  stage1-coverage:
    name: Multi-brand Stage 1 coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ELF reader
        run: python -m pip install pyelftools==0.32
      - name: Test Stage 1 coverage
        run: python -m unittest discover -s tools/inventory -p 'test_stage1_coverage.py' -v
      - name: Run exhaustive Stage 1 coverage
        run: |
          mkdir -p .local/stage1-coverage
          python tools/inventory/stage1_coverage.py \
            --repo "$GH_REPO" \
            --commit-sha "$GITHUB_SHA" \
            --output-json ".local/stage1-coverage/stage1-coverage-${GITHUB_SHA}.json" \
            --output-md ".local/stage1-coverage/stage1-coverage-${GITHUB_SHA}.md"
      - name: Publish Stage 1 coverage reports
        run: |
          test -s ".local/stage1-coverage/stage1-coverage-${GITHUB_SHA}.md"
          test -s ".local/stage1-coverage/stage1-coverage-${GITHUB_SHA}.json"
          gh release upload ci-reports-v1 \
            ".local/stage1-coverage/stage1-coverage-${GITHUB_SHA}.md" \
            ".local/stage1-coverage/stage1-coverage-${GITHUB_SHA}.json" \
            --clobber
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Multi-brand Stage 1 coverage' \
            -f "head_sha=$GITHUB_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Multi-brand Stage 1 coverage' \
            -F "output[summary]=@.local/stage1-coverage/stage1-coverage-${GITHUB_SHA}.md"

  stage2-multibrand:
    name: Multi-brand Stage 2 extraction
    needs: [family-evidence, consumer-link]
    # Inventory-8 is measurement only. A failed control there means its results are
    # unvalidated, not that Stage 2 may not run: the gate rejects every pair with
    # or without those measurements, and it must be seen rejecting them.
    if: "!cancelled() && needs.family-evidence.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ELF reader
        run: python -m pip install pyelftools==0.32
      - name: Test the Stage 2 evidence gate
        run: PYTHONPATH=tools/thinkdiag python -m unittest discover -s tools/thinkdiag -p 'test_stage2_multibrand.py' -v
      - name: Download Inventory-7 and Inventory-8 evidence
        run: |
          mkdir -p .local/stage2/in .local/stage2/out
          gh release download ci-reports-v1 --pattern inventory7.json --dir .local/stage2/in --clobber
          # Inventory-8 is measurement only: Stage 2 must still run, and still
          # reject every pair, when it published nothing.
          gh release download ci-reports-v1 --pattern inventory8.json --dir .local/stage2/in --clobber || \
            echo 'inventory8.json is not published; Stage 2 continues without it'
      - name: Run Stage 2 multi-brand extraction behind the evidence gate
        run: |
          python tools/thinkdiag/stage2_multibrand.py \
            --inventory7-json .local/stage2/in/inventory7.json \
            --inventory8-json .local/stage2/in/inventory8.json \
            --repo "$GH_REPO" \
            --out-dir .local/stage2/out \
            --commit-sha "$GITHUB_SHA"
      - name: Publish Stage 2 reports and packs
        run: |
          test -s ".local/stage2/out/stage2-multibrand-${GITHUB_SHA}.md"
          test -s ".local/stage2/out/stage2-multibrand-${GITHUB_SHA}.json"
          gh release upload ci-reports-v1 \
            ".local/stage2/out/stage2-multibrand-${GITHUB_SHA}.md" \
            ".local/stage2/out/stage2-multibrand-${GITHUB_SHA}.json" \
            --clobber
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Multi-brand Stage 2 extraction' \
            -f "head_sha=$GITHUB_SHA" \
            -f status=completed \
            -f conclusion=success \
            -f 'output[title]=Multi-brand Stage 2 extraction' \
            -F "output[summary]=@.local/stage2/out/stage2-multibrand-${GITHUB_SHA}.md"

