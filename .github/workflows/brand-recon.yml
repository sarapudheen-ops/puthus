name: Inspect brand archives

# Triggers on a push that touches this file so a feature branch can run a batch.
# Brand-agnostic reconnaissance. Runs on GitHub's runners because release-asset
# downloads are blocked from some build environments; no vendor code is executed.
on:
  workflow_dispatch:
    inputs:
      brands:
        description: 'Comma-separated release asset names without .zip (e.g. EOBD2,DEMO,TOYOTA)'
        required: true
        default: 'EOBD2,DEMO'
      deep:
        description: 'Deep member inspection (slower; skip for archives over ~150 MB)'
        required: true
        type: boolean
        default: true
  # A workflow must exist on the default branch before workflow_dispatch works.
  # This fallback lets a feature branch run the same inspection by pushing a change
  # to this file, with the brand list set below.
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/brand-recon.yml'

permissions:
  contents: write # Publish the built DTC packs as release assets the app can import.
  checks: write

jobs:
  inspect:
    name: Inspect brand archives (no vendor code execution)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Push runs cannot take inputs, so fall back to the default list.
      BRANDS: ${{ inputs.brands || 'BENZ,BMW' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install analysis dependencies
        run: python3 -m pip install -r tools/thinkdiag/requirements.txt

      - name: Download the requested brand archives outside git
        run: |
          set -euo pipefail
          mkdir -p .local/brands
          IFS=',' read -ra LIST <<< "$BRANDS"
          for brand in "${LIST[@]}"; do
            brand="$(echo "$brand" | tr -d '[:space:]')"
            [ -z "$brand" ] && continue
            echo "::group::download $brand.zip"
            gh release download assets-v1 --pattern "$brand.zip" --dir .local/brands --clobber
            ls -l ".local/brands/$brand.zip"
            echo "::endgroup::"
          done

      - name: Inspect every requested archive as data only
        run: |
          set -euo pipefail
          mkdir -p .local/recon
          for zip in .local/brands/*.zip; do
            brand="$(basename "$zip" .zip)"
            echo "::group::inspect $brand"
            python3 tools/thinkdiag/inspect_pack.py "$zip" --output ".local/recon/$brand" || {
              echo "inspect failed for $brand" | tee ".local/recon/$brand.error"
            }
            echo "::endgroup::"
          done

      - name: Summarise the support matrix
        run: |
          set -euo pipefail
          python3 tools/thinkdiag/brand_summary.py .local/recon

      - name: Compare native library hashes across brands
        run: |
          set -euo pipefail
          python3 tools/thinkdiag/brand_libs.py .local/brands --output .local/recon || {
            echo "library comparison failed"; exit 0; }
          cat .local/recon/library-hashes.md >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Brand library hash comparison' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Shared native libraries across brands' \
            -F 'output[summary]=@.local/recon/library-hashes.md' || echo "library check publish skipped"

      - name: Recover text libraries without hard-coded addresses
        run: |
          set -euo pipefail
          python3 tools/thinkdiag/extract_brand_text.py .local/brands/*.zip \
            --output .local/recon/text --report .local/recon \
            && echo "text recovery ok" || echo "some brands failed; see summary"
          if [ -f .local/recon/brand-text-summary.md ]; then
            cat .local/recon/brand-text-summary.md >> "$GITHUB_STEP_SUMMARY"
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name='Brand text recovery' -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Recovered text libraries per brand' \
              -F 'output[summary]=@.local/recon/brand-text-summary.md' || echo "publish skipped"
            [ -f .local/recon/brand-text-detail.md ] && cat .local/recon/brand-text-detail.md >> "$GITHUB_STEP_SUMMARY"
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name='Brand text detail' -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Recovered text members per brand' \
              -F 'output[summary]=@.local/recon/brand-text-detail.md' || echo "detail skipped"
          fi

      - name: Probe the label -> request/formula join
        run: |
          set -euo pipefail
          python3 tools/thinkdiag/probe_members.py .local/recon/text \
            --per-member 2 --output .local/recon/record-shapes.md || echo "probe failed"
          if [ -f .local/recon/record-shapes.md ]; then
            cat .local/recon/record-shapes.md >> "$GITHUB_STEP_SUMMARY"
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name='Record shape probe' -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Recovered record shapes' \
              -F 'output[summary]=@.local/recon/record-shapes.md' || echo "probe publish skipped"
          fi

      - name: Parse the recovered scaling rules
        run: |
          set -euo pipefail
          python3 tools/thinkdiag/parse_calc.py .local/recon/text \
            --output .local/recon/calc-rules.md || echo "no calc rules parsed"
          if [ -f .local/recon/calc-rules.md ]; then
            cat .local/recon/calc-rules.md >> "$GITHUB_STEP_SUMMARY"
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name='Scaling rules parsed' -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Recovered scaling rules' \
              -F 'output[summary]=@.local/recon/calc-rules.md' || echo "calc publish skipped"
          fi

      - name: Probe namespace joins between members
        run: |
          set -euo pipefail
          python3 tools/thinkdiag/join_probe.py .local/recon/text \
            --output .local/recon/join-probe.md || echo "join probe failed"
          if [ -f .local/recon/join-probe.md ]; then
            cat .local/recon/join-probe.md >> "$GITHUB_STEP_SUMMARY"
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name='Namespace join probe' -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Do the recovered tables join?' \
              -F 'output[summary]=@.local/recon/join-probe.md' || echo "join publish skipped"
          fi

      - name: Build app-importable DTC packs
        run: |
          set -euo pipefail
          mkdir -p .local/packs
          python3 tools/thinkdiag/dtcpairs.py .local/recon/text \
            --output .local/recon/separators.md || echo "separator probe failed"
          python3 tools/thinkdiag/raw_samples.py .local/recon/text \
            --output .local/recon/raw-samples.md || echo "raw sample failed"
          for report in separators raw-samples; do
            [ -f ".local/recon/$report.md" ] || continue
            cat ".local/recon/$report.md" >> "$GITHUB_STEP_SUMMARY"
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name="TCODE $report" -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f "output[title]=TCODE $report" \
              -F "output[summary]=@.local/recon/$report.md" || echo "$report publish skipped"
          done
          # A brand can ship several TCODE libraries (BENZ: TCODE_EN, TCODE_EX_EN, TCODE_X_EN).
          # Merge every one of them per brand before converting.
          mkdir -p .local/merged
          for branddir in $(ls .local/recon/text/*_TCODE*.GAG.json 2>/dev/null | sed 's/.*\///; s/_.*//' | sort -u); do
            python3 tools/thinkdiag/merge_tcode.py .local/recon/text --brand "$branddir" \
              --output ".local/merged/${branddir}_TCODE_ALL.json" || true
          done
          for src in .local/merged/*_TCODE_ALL.json; do
            [ -f "$src" ] || continue
            brand=$(basename "$src" | sed 's/_.*//')
            case "$brand" in
              VW)  makes="Volkswagen" ;;
              AUDI) makes="Audi" ;;
              SKODA) makes="Skoda" ;;
              SEAT) makes="SEAT" ;;
              BENZ) makes="Mercedes-Benz" ;;
              SMART) makes="Smart" ;;
              SPRINTER) makes="Mercedes-Benz" ;;
              OPEL) makes="Opel" ;;
              PORSCHE) makes="Porsche" ;;
              BMW) makes="BMW" ;;
              MINI) makes="Mini" ;;
              *)   makes="$brand" ;;
            esac
            sep=$(python3 tools/thinkdiag/dtcpairs.py .local/recon/text --output /dev/null 2>/dev/null \
              | head -1 >/dev/null && echo NUL)
            case "$brand" in BMW) sep="NUL" ;; esac
            python3 tools/thinkdiag/convert_brand_dtcs.py "$src" --brand "$brand" \
              --makes "$makes" --separator "$sep" --output ".local/packs/${brand,,}-dtcs.json" \
              || echo "$brand: conversion produced no pack"
          done
          ls -la .local/packs || true
          python3 tools/thinkdiag/pack_summary.py .local/packs --output .local/packs/summary.md \
            && cat .local/packs/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no packs built"

      - name: Publish DTC packs so they can be downloaded without a GitHub login
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls .local/packs/*-dtcs.json >/dev/null 2>&1 || { echo "no packs to publish"; exit 0; }
          TAG=dtc-packs
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "Brand DTC packs (import into bod3)" \
              --notes "Import these in the app: Data packs -> Import. Recovered fault-code text only: no PIDs, addresses or tests. Reference text, not a confirmed diagnosis."
          else
            gh release create "$TAG" --prerelease --title "Brand DTC packs (import into bod3)" \
              --notes "Import these in the app: Data packs -> Import. Recovered fault-code text only: no PIDs, addresses or tests. Reference text, not a confirmed diagnosis."
          fi
          gh release upload "$TAG" .local/packs/*-dtcs.json --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'

      - name: Publish the pack summary as a check
        if: always()
        run: |
          set -euo pipefail
          if [ -f .local/packs/summary.md ]; then
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name='DTC packs built' -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=App-importable DTC packs' \
              -F 'output[summary]=@.local/packs/summary.md' || echo "publish skipped"
          fi

      - name: Upload the DTC packs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brand-dtc-packs
          path: .local/packs/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish sample recovered records
        run: |
          set -euo pipefail
          python3 tools/thinkdiag/text_samples.py .local/recon/brand-text-summary.json \
            --output .local/recon/samples.md || echo "samples skipped"
          if [ -f .local/recon/samples.md ]; then
            cat .local/recon/samples.md >> "$GITHUB_STEP_SUMMARY"
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name='Recovered record samples' -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Sample recovered records' \
              -F 'output[summary]=@.local/recon/samples.md' || echo "samples publish skipped"
          fi

      - name: Publish the support matrix as a check
        if: always()
        run: |
          set -euo pipefail
          if [ -f .local/recon/summary.md ]; then
            cat .local/recon/summary.md >> "$GITHUB_STEP_SUMMARY"
            [ -f .local/recon/members.md ] && cat .local/recon/members.md >> "$GITHUB_STEP_SUMMARY"
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name='Brand archive support matrix' -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Brand archive inspection' \
              -F 'output[summary]=@.local/recon/summary.md'
          fi
          if [ -f .local/recon/members.md ]; then
            gh api --method POST "repos/$GH_REPO/check-runs" \
              -f name='Brand archive members' -f head_sha="$GITHUB_SHA" \
              -f status=completed -f conclusion=success \
              -f 'output[title]=Brand archive member detail' \
              -F 'output[summary]=@.local/recon/members.md' || echo "members check publish skipped"
          fi

      - name: Upload inspection reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brand-recon
          path: .local/recon/
          if-no-files-found: warn
          retention-days: 14
