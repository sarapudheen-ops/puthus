name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble, lint & test (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the checked-in Gradle wrapper JAR against known checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare complete offline Toyota app data
        uses: ./.github/actions/prepare-toyota

      - name: Verify names-only catalog seed
        run: python3 tools/generate_catalog_seed.py --check

      - name: Build debug APK, run lint and unit tests
        run: |
          set -o pipefail
          ./gradlew assembleDebug lintDebug testDebugUnitTest --continue --stacktrace 2>&1 | tee build.log

      - name: Summarise unit tests
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          [ ${#files[@]} -gt 0 ] || exit 0
          sum() { grep -ho "<testsuite [^>]*" "${files[@]}" | grep -o " $1=\"[0-9]*\"" | grep -o "[0-9]*" | awk '{ t += $1 } END { print t + 0 }'; }
          echo "::notice title=Unit tests::$(sum tests) tests, $(sum failures) failures, $(sum errors) errors, $(sum skipped) skipped in ${#files[@]} classes"

      # Surface compiler errors, lint errors and test failures as annotations on the PR.
      - name: Annotate build failures
        if: failure()
        run: .github/scripts/annotate-build-failures.sh build.log

      - name: Verify the APK really bundles the complete Toyota source library
        run: |
          python3 tools/thinkdiag/verify_app_database.py --directory .local/toyota-app-assets/toyota-source \
            --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn
