name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble, lint & test (debug)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the checked-in Gradle wrapper JAR against known checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare complete offline Toyota app data
        uses: ./.github/actions/prepare-toyota

      - name: Verify names-only catalog seed
        run: python3 tools/generate_catalog_seed.py --check

      - name: Build debug APK, run lint and unit tests
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest --continue --stacktrace 2>&1 | tee build.log

      - name: Summarise unit tests
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          [ ${#files[@]} -gt 0 ] || exit 0
          sum() { grep -ho "<testsuite [^>]*" "${files[@]}" | grep -o " $1=\"[0-9]*\"" | grep -o "[0-9]*" | awk '{ t += $1 } END { print t + 0 }'; }
          echo "::notice title=Unit tests::$(sum tests) tests, $(sum failures) failures, $(sum errors) errors, $(sum skipped) skipped in ${#files[@]} classes"

      # Surface compiler errors, lint errors and test failures as annotations on the PR.
      - name: Annotate build failures
        if: failure()
        run: .github/scripts/annotate-build-failures.sh build.log

      - name: Verify the APK really bundles the complete Toyota source library
        run: |
          python3 tools/thinkdiag/verify_app_database.py --directory .local/toyota-app-assets/toyota-source \
            --apk app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload device-test APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-device-tests
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
            build/reports/
          if-no-files-found: warn

  offline-source-device:
    name: Offline source library (Android 24)
    # One real minSdk run per push, rather than duplicating an emulator on the PR event.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: .local/device/app
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-device-tests
          path: .local/device/tests
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the actual APK and inspect every source family on minSdk
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p .local/device/reports
            adb install .local/device/app/app-debug.apk
            adb install .local/device/tests/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.bod3.app.source.ToyotaSourceInstrumentedTest com.bod3.app.test/androidx.test.runner.AndroidJUnitRunner | tee .local/device/reports/instrumentation.txt
            adb logcat -d > .local/device/reports/logcat.txt
            grep -Eq '^OK \([1-9][0-9]* tests?\)' .local/device/reports/instrumentation.txt
            ! grep -q 'FAILURES!!!' .local/device/reports/instrumentation.txt
      - name: Upload Android SQLite smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-library-android24-results
          path: .local/device/reports/
          if-no-files-found: warn
