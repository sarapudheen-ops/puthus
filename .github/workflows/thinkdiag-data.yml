      - name: Publish masked-step outcomes and promotion log tail
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          O_stage1f_detail_probe: ${{ steps.stage1f_detail_probe.outcome }}
          O_stage4a_schema_probe: ${{ steps.stage4a_schema_probe.outcome }}
          O_code1_lifecycle_sweep: ${{ steps.code1_lifecycle_sweep.outcome }}
          O_publish_ecu_input: ${{ steps.publish_ecu_input.outcome }}
          O_publish_native_outcome: ${{ steps.publish_native_outcome.outcome }}
          O_publish_link_promotion: ${{ steps.publish_link_promotion.outcome }}
          O_publish_stage1b_report: ${{ steps.publish_stage1b_report.outcome }}
          O_publish_stage1c_report: ${{ steps.publish_stage1c_report.outcome }}
          O_publish_sweep_reports: ${{ steps.publish_sweep_reports.outcome }}
          O_publish_convert_log: ${{ steps.publish_convert_log.outcome }}
          O_publish_sweep_evidence: ${{ steps.publish_sweep_evidence.outcome }}
          O_publish_static_reports: ${{ steps.publish_static_reports.outcome }}
          O_publish_dtc_shards: ${{ steps.publish_dtc_shards.outcome }}
          O_publish_inspection_check: ${{ steps.publish_inspection_check.outcome }}
          O_publish_stage0_report: ${{ steps.publish_stage0_report.outcome }}
          O_publish_stage3a_report: ${{ steps.publish_stage3a_report.outcome }}
        run: |
          mkdir -p .local/thinkdiag/report
          PROMO_LOG=.local/thinkdiag/report/promotion-step.log
          FAILS=0
          for out in "$O_stage1f_detail_probe" "$O_stage4a_schema_probe" "$O_code1_lifecycle_sweep" "$O_publish_ecu_input" "$O_publish_native_outcome" \
            "$O_publish_link_promotion" "$O_publish_stage1b_report" "$O_publish_stage1c_report" \
            "$O_publish_sweep_reports" "$O_publish_convert_log" "$O_publish_sweep_evidence" \
            "$O_publish_static_reports" "$O_publish_dtc_shards" "$O_publish_inspection_check" \
            "$O_publish_stage3a_report" "$O_publish_stage0_report"; do
            if [ "$out" = failure ]; then FAILS=$((FAILS + 1)); fi
          done
          CONC=success
          if [ "$FAILS" -gt 0 ]; then CONC=failure; fi
          {
            echo "## Masked step outcomes: $FAILS raw failure(s) among 16 continue-on-error steps"
            echo
            echo 'Raw steps.<id>.outcome values are not masked; step conclusions and the job conclusion are.'
            echo
            echo '| step id | raw outcome |'
            echo '|---|---|'
            echo "| stage1f_detail_probe | $O_stage1f_detail_probe |"
            echo "| stage4a_schema_probe | $O_stage4a_schema_probe |"
            echo "| code1_lifecycle_sweep | $O_code1_lifecycle_sweep |"
            echo "| publish_ecu_input | $O_publish_ecu_input |"
            echo "| publish_native_outcome | $O_publish_native_outcome |"
            echo "| publish_link_promotion | $O_publish_link_promotion |"
            echo "| publish_stage1b_report | $O_publish_stage1b_report |"
            echo "| publish_stage1c_report | $O_publish_stage1c_report |"
            echo "| publish_sweep_reports | $O_publish_sweep_reports |"
            echo "| publish_convert_log | $O_publish_convert_log |"
            echo "| publish_sweep_evidence | $O_publish_sweep_evidence |"
            echo "| publish_static_reports | $O_publish_static_reports |"
            echo "| publish_dtc_shards | $O_publish_dtc_shards |"
            echo "| publish_inspection_check | $O_publish_inspection_check |"
            echo "| publish_stage3a_report | $O_publish_stage3a_report |"
            echo "| publish_stage0_report | $O_publish_stage0_report |"
            echo
            echo '## Promotion step log tail (last 80 lines)'
            echo
            echo '```text'
            tail -n 80 "$PROMO_LOG" 2>/dev/null || echo '(promotion log missing)'
            echo '```'
          } > .local/thinkdiag/report/masked-outcomes.md
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Toyota masked-step outcomes' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion="$CONC" \
            -f "output[title]=$FAILS raw failure(s) among 16 continue-on-error steps" \
            -F 'output[summary]=@.local/thinkdiag/report/masked-outcomes.md'
