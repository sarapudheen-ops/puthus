name: Inspect Toyota release data

# Stage 3b head note: no step, input or permission changes here; the sweep step now
# also records stop contexts, a labelled stand-in re-run and a per-class window decode
# in its own report. Nothing is enabled and no validator or pack input changes.
# Stage 3c head note: the same step now also reports the ELF identity of the null cell
# and the last 60 instructions before the guest returns. Steps, inputs and permissions
# are unchanged and nothing is enabled.
# Stage 3d head note: the same step now also scans every shipped object for a writer of
# that cell and re-runs all 976 tuples with one hook return changed, so its timeout is
# raised to 60 minutes. Steps, inputs, permissions and masking are unchanged.
# Stage 3d docs note: the only change on this head is the written report in
# docs/toyota-progress.md; this comment keeps actionlint on the same head as the run.
# Stage 3e head note: the sweep step now also disassembles every shipped object for
# call sites of OpenAbstractCommDll, records the twelve instructions before each and
# the origin of x0, and (only when x0 is a supplied function address) runs one
# exploratory variant. Steps, inputs, permissions and masking are unchanged.
# Stage 3e docs note: the report in docs/toyota-progress.md is the only other change on
# this head; this comment keeps actionlint on the same head as the run.

on:
  workflow_dispatch:
    inputs:
      recover-source-inputs:
        description: Recover checksummed decoded research arrays when release storage redirects are blocked (no APK build)
        type: boolean
        default: false
  push:
    branches: ['arena/**', 'main']
    paths:
      - 'tools/thinkdiag/**'
      - '.github/workflows/thinkdiag-data.yml'
      - 'app/src/main/assets/datapacks/toyota-lexus-dtcs.json'
      - 'docs/toyota-progress.md'

permissions:
  actions: read
  contents: write
  checks: write
  pull-requests: write

jobs:
  recover-source-inputs:
    name: Recover complete checksummed source inputs (research only)
    if: github.event_name == 'workflow_dispatch' && inputs.recover-source-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download and verify the authoritative archive outside Git
        run: |
          mkdir -p .local/source-inputs
          gh release download assets-v1 --pattern TOYOTA.zip --dir .local/source-inputs
          python3 -m pip install -r tools/thinkdiag/requirements.txt
          python3 tools/thinkdiag/source_verification.py .local/source-inputs/TOYOTA.zip
          python3 tools/thinkdiag/decode_toyota.py .local/source-inputs/TOYOTA.zip \
            --output .local/source-inputs/decoded --report .local/source-inputs/report
      - name: Publish bounded checked source-input evidence (never an executable-coverage claim)
        run: |
          python3 tools/thinkdiag/source_input_evidence.py publish .local/source-inputs/TOYOTA.zip \
            --decoded .local/source-inputs/decoded --manifest .local/source-inputs/report/decoded-manifest.json
  inspect:
    name: Inspect owner-verified Toyota specification
    if: github.event_name != 'workflow_dispatch' || !inputs.recover-source-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - name: Download original release asset outside git
        run: |
          mkdir -p .local/thinkdiag
          gh release download assets-v1 --pattern TOYOTA.zip --dir .local/thinkdiag
      - name: Verify the complete archive against the owner's attestation
        run: python3 tools/thinkdiag/source_verification.py .local/thinkdiag/TOYOTA.zip
      - name: Install offline analysis dependencies
        run: python3 -m pip install -r tools/thinkdiag/requirements.txt
      - name: Test inspection tools
        run: python3 -m unittest discover -s tools/thinkdiag -p 'test_*.py' -v
      - name: Inspect the archive without executing its contents
        run: python3 tools/thinkdiag/inspect_pack.py .local/thinkdiag/TOYOTA.zip --output .local/thinkdiag/report
      - name: Examine native symbols and nested data
        run: |
          python3 tools/thinkdiag/analyze_toyota.py .local/thinkdiag/TOYOTA.zip --output .local/thinkdiag/report
          python3 tools/thinkdiag/static_readers.py .local/thinkdiag/TOYOTA.zip --output .local/thinkdiag/report
      - name: Decode the identified YZJM table wrapper
        run: |
          python3 tools/thinkdiag/decode_toyota.py .local/thinkdiag/TOYOTA.zip \
            --output .local/thinkdiag/decoded --report .local/thinkdiag/report
      - name: Recover complete decoded research inputs for an explicitly marked push
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[recover-toyota-inputs]')
        # Same owner-verified recovery as manual dispatch; the connected GitHub App
        # permits push-triggered Actions but may not permit workflow dispatch.
        run: |
          python3 tools/thinkdiag/source_input_evidence.py publish .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded --manifest .local/thinkdiag/report/decoded-manifest.json
      - name: Recover indexed English text
        run: |
          python3 tools/thinkdiag/extract_english.py .local/thinkdiag/TOYOTA.zip \
            --output .local/thinkdiag/english --report .local/thinkdiag/report
      - name: Inspect exact 2007 Innova source join (no link approval)
        run: |
          python3 tools/thinkdiag/inspect_innova_2007.py .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded --manifest .local/thinkdiag/report/decoded-manifest.json \
            --english .local/thinkdiag/english --output .local/thinkdiag/report/innova-2007-join.json
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Toyota 2007 Innova source join' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Exact source join; adapter equivalence not approved' \
            -F 'output[summary]=@.local/thinkdiag/report/innova-2007-join.json'
      - name: Compare supplied FILE COMM SYSP DTCF CALC instructions with bounded ports (offline only)
        id: native_oracle
        run: |
          python3 tools/thinkdiag/toyota_native_oracle.py run .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded \
            --manifest .local/thinkdiag/report/decoded-manifest.json \
            --output .local/thinkdiag/report/native-oracle.json \
            --evidence-output .local/thinkdiag/report/code1-link-evidence.json
      - name: Sweep every diagnostic-table family and native reader
        run: |
          python3 tools/thinkdiag/sweep_toyota.py .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded --english .local/thinkdiag/english \
            --manifest .local/thinkdiag/report/decoded-manifest.json \
            --output .local/thinkdiag/sweep --report .local/thinkdiag/report
      - name: Convert source-bound, on-demand vehicle packs in Actions
        run: |
          set -euo pipefail
          LOG=.local/thinkdiag/report/convert-step.log
          exec > >(tee "$LOG") 2>&1
          set -x
          echo "[ecmect] compile pinned read artifacts"
          python3 tools/thinkdiag/toyota_runtime_compile.py compile .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded --manifest .local/thinkdiag/report/decoded-manifest.json \
            --output .local/thinkdiag/vehicle-packs
          echo "[ecmect] compile pinned 2007 source read candidate"
          python3 tools/thinkdiag/toyota_innova_2007_reads.py .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded --manifest .local/thinkdiag/report/decoded-manifest.json \
            --english .local/thinkdiag/english --pilot-artifacts .local/thinkdiag/vehicle-packs \
            --output .local/thinkdiag/vehicle-packs/innova-2007-source-read-candidate.json
          echo "[ecmect] measure baseline container without oracle promotion"
          python3 tools/thinkdiag/convert_vehicle_packs.py .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded --english .local/thinkdiag/english \
            --manifest .local/thinkdiag/report/decoded-manifest.json \
            --read-artifacts .local/thinkdiag/vehicle-packs \
            --output .local/thinkdiag/vehicle-packs-baseline
          echo "[ecmect] convert vehicle packs (reads artifacts + complete native evidence)"
          python3 tools/thinkdiag/convert_vehicle_packs.py .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded --english .local/thinkdiag/english \
            --manifest .local/thinkdiag/report/decoded-manifest.json \
            --read-artifacts .local/thinkdiag/vehicle-packs \
            --oracle-evidence .local/thinkdiag/report/code1-link-evidence.json \
            --group-enable-artifacts tools/thinkdiag/schema \
            --output .local/thinkdiag/vehicle-packs
          echo "[ecmect] lifecycle contracts"
          python3 tools/thinkdiag/toyota_lifecycle_contracts.py compile .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded --manifest .local/thinkdiag/report/decoded-manifest.json \
            --output .local/thinkdiag/vehicle-packs
          echo "[ecmect] verify artifacts"
          python3 tools/thinkdiag/toyota_lifecycle_contracts.py verify .local/thinkdiag/vehicle-packs
          python3 tools/thinkdiag/toyota_runtime_compile.py verify .local/thinkdiag/vehicle-packs
          python3 tools/thinkdiag/toyota_runtime_compile.py test-artifacts .local/thinkdiag/vehicle-packs > .local/thinkdiag/vehicle-packs/compiled-source-read-validation.json
          PYTHONPATH=tools/thinkdiag TOYOTA_PACK_DIRECTORY=.local/thinkdiag/vehicle-packs python3 -m unittest test_ecmect_pack -v
          cat .local/thinkdiag/vehicle-packs/compiled-source-read-validation.json
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Toyota exact compiled source reads' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Typed source artifacts and computed checks; not production definitions' \
            -F 'output[summary]=@.local/thinkdiag/vehicle-packs/compiled-source-read-validation.json'
          python3 tools/thinkdiag/verify_vehicle_bundle.py --directory .local/thinkdiag/vehicle-packs --require-executable
          TOYOTA_PACK_DIRECTORY=.local/thinkdiag/vehicle-packs python3 tools/thinkdiag/verify_ecmect_evidence.py > .local/thinkdiag/report/ecmect-acceptance.json
          cat .local/thinkdiag/report/ecmect-acceptance.json
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Toyota exact two-system acceptance evidence' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Verified counts, identities and 2007 provenance; physical validation pending' \
            -F 'output[summary]=@.local/thinkdiag/report/ecmect-acceptance.json'
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Toyota vehicle conversion accounting' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Partial conversion: unresolved items remain disabled' \
            -F 'output[summary]=@.local/thinkdiag/vehicle-packs/conversion-report.md'
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Toyota group DTC enable qualification' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Per-system group qualification; pin candidates are not an enablement' \
            -F 'output[summary]=@.local/thinkdiag/vehicle-packs/group-dtc-enable.md'
      - name: Run read-only Code 1 lifecycle join sweep
        id: code1_lifecycle_sweep
        continue-on-error: true
        run: |
          python3 tools/thinkdiag/toyota_code1_lifecycle_sweep.py .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded --manifest .local/thinkdiag/report/decoded-manifest.json \
            --output .local/thinkdiag/report/code1-lifecycle-sweep \
            --ecmect-review .local/thinkdiag/vehicle-packs/mandatory-ecmect-source-reads.json \
            --native-evidence .local/thinkdiag/report/code1-link-evidence.json
      - name: Audit Code 1 native lifecycle evidence against the sweep tuple set
        run: |
          python3 tools/thinkdiag/report_code1_link_evidence.py \
            .local/thinkdiag/report/code1-link-evidence.json \
            .local/thinkdiag/report/code1-lifecycle-sweep/code1-lifecycle-sweep.json \
            --output .local/thinkdiag/report
          cat .local/thinkdiag/report/code1-link-evidence-summary.md
      # Stage 3a evidence step: read-only census plus the native setup probe over native
      # transport codes 3 and 4 (nothing enabled). It writes no pack, APK or validator
      # output; the next step publishes the report, including a failure traceback.
      - name: Sweep native transport codes 3 and 4 (CAN) read-only
        id: stage3a_can_sweep
        timeout-minutes: 60
        run: |
          set -euo pipefail
          mkdir -p .local/thinkdiag/report/can-link-sweep .local/thinkdiag/published-census
          gh release download ci-reports-v1 --pattern pack-census.json \
            --dir .local/thinkdiag/published-census --clobber || true
          ARGS=(--packs .local/thinkdiag/vehicle-packs)
          if [ -f .local/thinkdiag/published-census/pack-census.json ]; then
            ARGS+=(--published-census .local/thinkdiag/published-census/pack-census.json)
          fi
          python3 tools/thinkdiag/toyota_can_link_sweep.py .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded \
            --manifest .local/thinkdiag/report/decoded-manifest.json \
            "${ARGS[@]}" --output .local/thinkdiag/report/can-link-sweep
      - name: Publish the native codes 3/4 evidence report
        id: publish_stage3a_report
        continue-on-error: true
        if: always() && hashFiles('.local/thinkdiag/report/can-link-sweep/can-link-sweep.md') != ''
        env:
          SWEEP: ${{ steps.stage3a_can_sweep.outcome }}
        run: |
          CONC=success
          if [ "$SWEEP" != success ]; then CONC=failure; fi
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Toyota CAN link sweep' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion="$CONC" \
            -f 'output[title]=Read-only codes 3/4 census and native setup probe; nothing enabled' \
            -F 'output[summary]=@.local/thinkdiag/report/can-link-sweep/can-link-sweep.md'
      - name: Run and publish Stage 4a schema probe (read-only)
        id: stage4a_schema_probe
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set +e
          DIR=.local/thinkdiag/report/stage4a
          mkdir -p "$DIR"
          python3 tools/thinkdiag/stage4a_schema_probe.py \
            --archive .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded \
            --manifest .local/thinkdiag/report/decoded-manifest.json \
            --systems .local/thinkdiag/vehicle-packs/systems.jsonl.gz \
            --output "$DIR" > "$DIR/stage4a.log" 2>&1
          STATUS=$?
          if [ ! -s "$DIR/stage-4a-probe.md" ] || [ ! -s "$DIR/stage-4a-probe.json" ]; then
            # shellcheck disable=SC2016
            python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); log=(p/"stage4a.log").read_text(); (p/"stage-4a-probe.md").write_text("# Stage 4a probe failed before report generation\n\n```text\n"+log+"\n```\n"); (p/"stage-4a-probe.json").write_text(json.dumps({"error":log,"exitStatus":int(sys.argv[2])})+"\n")' "$DIR" "$STATUS"
            STATUS=1
          fi
          cat "$DIR/stage4a.log"
          CONC=success
          if [ "$STATUS" -ne 0 ]; then CONC=failure; fi
          gh release upload ci-reports-v1 "$DIR/stage-4a-probe.md" "$DIR/stage-4a-probe.json" --clobber
          UPLOAD=$?
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Stage 4a schema probe' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion="$CONC" \
            -f 'output[title]=Stage 4a read-only schema census' \
            -F "output[summary]=@$DIR/stage-4a-probe.md"
          CHECK=$?
          if [ "$STATUS" -ne 0 ] || [ "$UPLOAD" -ne 0 ] || [ "$CHECK" -ne 0 ]; then exit 1; fi
      - name: Run Stage 1b parameterized DTC probe (group-based, read-only)
        id: stage1b_probe
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p .local/thinkdiag/report
          LOG=.local/thinkdiag/report/stage-1b-probe-step.log
          START=$(date +%s)
          set -x
          python3 tools/thinkdiag/parameterized_dtc_probe.py \
            --archive .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded \
            --manifest .local/thinkdiag/report/decoded-manifest.json \
            --english .local/thinkdiag/english \
            --systems .local/thinkdiag/vehicle-packs/systems.jsonl.gz \
            --native-oracle .local/thinkdiag/report/native-oracle.json \
            --ecmect-review-dir .local/thinkdiag/vehicle-packs \
            --head-sha "$GITHUB_SHA" \
            --max-seconds 600 \
            --output .local/thinkdiag/report/stage-1b-probe.md \
            --json-output .local/thinkdiag/report/stage-1b-probe.json 2>&1 | tee "$LOG"
          PROBE_STATUS=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "[stage1b] elapsed=$((END-START))s exit=$PROBE_STATUS" | tee -a "$LOG"
          exit "$PROBE_STATUS"
      - name: Run Stage 1c group-keyed DTC oracle (native replay per compiled group)
        id: stage1c_oracle
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p .local/thinkdiag/report
          LOG=.local/thinkdiag/report/stage-1c-oracle-step.log
          python3 -m unittest discover -s tools/thinkdiag -p 'test_*.py' \
            > .local/thinkdiag/report/stage-1c-tests.log 2>&1 || true
          START=$(date +%s)
          set -x
          python3 tools/thinkdiag/stage1c_group_oracle.py \
            --archive .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded \
            --manifest .local/thinkdiag/report/decoded-manifest.json \
            --english .local/thinkdiag/english \
            --systems .local/thinkdiag/vehicle-packs/systems.jsonl.gz \
            --ecmect-review-dir .local/thinkdiag/vehicle-packs \
            --pack-directory .local/thinkdiag/vehicle-packs \
            --test-log .local/thinkdiag/report/stage-1c-tests.log \
            --native-oracle .local/thinkdiag/report/native-oracle.json \
            --head-sha "$GITHUB_SHA" \
            --max-seconds 900 \
            --output .local/thinkdiag/report/stage-1c-oracle.md \
            --json-output .local/thinkdiag/report/stage-1c-oracle.json 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          END=$(date +%s)
          echo "[stage1c] elapsed=$((END-START))s exit=$STATUS" | tee -a "$LOG"
          exit "$STATUS"
      - name: Run and publish Stage 1f detail-row probe (read-only)
        id: stage1f_detail_probe
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set +e
          DIR=.local/thinkdiag/report/stage1f
          mkdir -p "$DIR"
          python3 tools/thinkdiag/stage1f_detail_probe.py \
            --archive .local/thinkdiag/TOYOTA.zip \
            --decoded .local/thinkdiag/decoded \
            --manifest .local/thinkdiag/report/decoded-manifest.json \
            --english .local/thinkdiag/english \
            --systems .local/thinkdiag/vehicle-packs/systems.jsonl.gz \
            --stage1c .local/thinkdiag/report/stage-1c-oracle.json \
            --packs .local/thinkdiag/vehicle-packs \
            --baseline .local/thinkdiag/main-baseline-packs \
            --output "$DIR" > "$DIR/stage1f.log" 2>&1
          STATUS=$?
          if [ ! -s "$DIR/stage-1f-probe.md" ] || [ ! -s "$DIR/stage-1f-probe.json" ]; then
            # shellcheck disable=SC2016
            python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); log=(p/"stage1f.log").read_text(); (p/"stage-1f-probe.md").write_text("# Stage 1f failed before report generation\n\n```text\n"+log+"\n```\n"); (p/"stage-1f-probe.json").write_text(json.dumps({"error":log,"exitStatus":int(sys.argv[2])})+"\n")' "$DIR" "$STATUS"
            STATUS=1
          fi
          cat "$DIR/stage1f.log"
          CONC=success
          if [ "$STATUS" -ne 0 ]; then CONC=failure; fi
          gh release upload ci-reports-v1 "$DIR/stage-1f-probe.md" "$DIR/stage-1f-probe.json" --clobber
          UPLOAD=$?
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Stage 1f detail-row probe' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion="$CONC" \
            -f 'output[title]=Stage 1f exact detail-row census' \
            -F "output[summary]=@$DIR/stage-1f-probe.md"
          CHECK=$?
          if [ "$STATUS" -ne 0 ] || [ "$UPLOAD" -ne 0 ] || [ "$CHECK" -ne 0 ]; then exit 1; fi
      - name: Publish checksummed ECU program-dispatch input for exact reader work
        id: publish_ecu_input
        continue-on-error: true
        # The agent workspace cannot follow the release-asset storage redirect. Keep
        # this small, owner-verified source input in research evidence, never Git/APK.
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          source = Path('.local/thinkdiag/decoded/ECUPROGRAM.BIN').read_bytes()
          manifest = json.loads(Path('.local/thinkdiag/report/decoded-manifest.json').read_text())
          item = next(r for r in manifest if r['file'] == 'ECUPROGRAM.BIN')
          assert len(source) == item['bytes'] and hashlib.sha256(source).hexdigest() == item['sha256']
          record = {**item, 'compression': 'zlib', 'base64': base64.b64encode(zlib.compress(source, 9)).decode('ascii')}
          Path('.local/thinkdiag/report/ecu-program-input.json').write_text(json.dumps(record, sort_keys=True))
          PY
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Toyota exact ECU program input' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Owner-source ECUPROGRAM input; not executable coverage' \
            -F 'output[summary]=@.local/thinkdiag/report/ecu-program-input.json'
      - name: Publish native comparison outcome (including failed reference gates)
        id: publish_native_outcome
        continue-on-error: true
        if: always() && hashFiles('.local/thinkdiag/report/native-oracle.md') != ''
        run: |
          if [ -f .local/thinkdiag/report/code1-link-evidence.json ]; then
            gh release upload ci-reports-v1 .local/thinkdiag/report/code1-link-evidence.json --clobber
          fi
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Toyota offline native differential' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion='${{ steps.native_oracle.outcome }}' \
            -f 'output[title]=Bounded offline semantic comparison; no adapter or ECU' \
            -F 'output[summary]=@.local/thinkdiag/report/native-oracle.md'
      - name: Publish Code 1 link-promotion report
        id: publish_link_promotion
        continue-on-error: true
        run: |
          exec > >(tee .local/thinkdiag/report/promotion-step.log) 2>&1
          python3 tools/thinkdiag/report_code1_link_promotion.py .local/thinkdiag/vehicle-packs \
            --baseline-index .local/thinkdiag/vehicle-packs-baseline/index.json \
            --sweep-json .local/thinkdiag/report/code1-lifecycle-sweep/code1-lifecycle-sweep.json
          gh release upload ci-reports-v1 \
            .local/thinkdiag/vehicle-packs/code1-link-promotion.md \
            .local/thinkdiag/vehicle-packs/code1-link-promotion.json --clobber
          REPORT=.local/thinkdiag/vehicle-packs/code1-link-promotion.md
          python3 - "$REPORT" "$GITHUB_SHA" <<'PY' > .local/thinkdiag/report/promotion-comments.json
          import datetime, json, pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          limit = 24000
          chunks = [text[i:i+limit] for i in range(0, len(text), limit)] or ['(empty report)']
          stamp = datetime.datetime.now(datetime.timezone.utc).isoformat()
          comments = []
          for i, chunk in enumerate(chunks, 1):
              title = f'Promotion report - part {i}/{len(chunks)}'
              if i == 1:
                  title += f' | head {sys.argv[2]} | {stamp}'
              comments.append(f'## {title}\n\n{chunk}')
          d = json.loads(pathlib.Path('.local/thinkdiag/vehicle-packs/code1-link-promotion.json').read_text())
          rows=d['systemsByLinkStatusRegionTransportBaud']
          proven=sum(r['systems'] for r in rows if r['linkStatus']=='proven')
          unproven=sum(r['systems'] for r in rows if r['linkStatus']=='unproven')
          comments.append(f"Promotion key numbers: {d['eligibleSystemRecords']} eligible; {proven} proven; {unproven} unproven; {d['containerBytesAfter']} container bytes. Head {sys.argv[2]}.")
          print(json.dumps(comments))
          PY
          python3 - <<'PY'
          import json, os, subprocess
          comments=json.load(open('.local/thinkdiag/report/promotion-comments.json'))
          for body in comments:
              subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['GH_REPO']}/issues/25/comments",'-f',f'body={body}'],check=True,stdout=subprocess.DEVNULL)
          # Verify every exact body is now present; comments are never silently skipped.
          existing=subprocess.check_output(['gh','api','--paginate',f"repos/{os.environ['GH_REPO']}/issues/25/comments",'--jq','.[].body'],text=True)
          assert all(body in existing for body in comments), 'Promotion report comment verification failed'
          print(f'Posted and verified {len(comments)-1} report parts and one key-numbers comment on PR #25')
          PY
          rm -rf .local/thinkdiag/vehicle-packs-baseline
      - name: Publish Stage 1b probe report and failure log
        id: publish_stage1b_report
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROBE_STEP_OUTCOME: ${{ steps.stage1b_probe.outcome }}
        run: |
          set -uo pipefail
          PR_NUMBER=$(gh pr view "$GITHUB_REF_NAME" --json number --jq .number || true)
          export PR_NUMBER
          python3 - <<'PY'
          import datetime, json, os, pathlib, subprocess
          repo = os.environ['GH_REPO']
          pr = os.environ.get('PR_NUMBER') or ''
          head = os.environ.get('GITHUB_SHA', 'NOT ESTABLISHED')
          outcome = os.environ.get('PROBE_STEP_OUTCOME', 'NOT ESTABLISHED')
          report = pathlib.Path('.local/thinkdiag/report/stage-1b-probe.md')
          payload = pathlib.Path('.local/thinkdiag/report/stage-1b-probe.json')
          log = pathlib.Path('.local/thinkdiag/report/stage-1b-probe-step.log')
          def post(body):
              if not pr:
                  print('No pull request for this ref; comment skipped')
                  return
              subprocess.run(['gh', 'api', '--method', 'POST',
                              f'repos/{repo}/issues/{pr}/comments', '-F', f'body={body}'],
                             check=True, stdout=subprocess.DEVNULL)
          data = {}
          if report.is_file() and payload.is_file():
              subprocess.run(['gh', 'release', 'upload', 'ci-reports-v1', str(report),
                              str(payload), '--clobber'], check=False)
              data = json.loads(payload.read_text())
              text = report.read_text()
              stamp = datetime.datetime.now(datetime.timezone.utc).isoformat()
              chunks = [text[i:i + 18000] for i in range(0, len(text), 18000)] or ['(empty probe report)']
              for index, chunk in enumerate(chunks, 1):
                  header = f'# Stage 1b probe report - part {index}/{len(chunks)}'
                  if index == 1:
                      header += (f'\n\nHead: {head}\nUTC: {stamp}'
                                 f'\nProbe step conclusion: {outcome}'
                                 f"\nProbe measured duration: {data.get('elapsedSeconds')}s"
                                 f"\nPartial: {data.get('partial')}")
                  post(header + '\n\n' + chunk)
              print(f'Posted {len(chunks)} Stage 1b probe comment(s)')
          if outcome != 'success':
              tail = ('\n'.join(log.read_text(errors='replace').splitlines()[-200:])
                      if log.is_file() else 'Probe failed before writing its log; see the failing step output.')
              post(f'# Stage 1b probe FAILURE log\n\nHead: {head}'
                   f'\nProbe step conclusion: {outcome}\n\n````text\n{tail[-40000:]}\n````')
          PY
