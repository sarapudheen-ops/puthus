name: Probe
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: read
  checks: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install -r tools/thinkdiag/requirements.txt
      - name: Download
        run: |
          mkdir -p .local/b
          gh release download assets-v1 --pattern EOBD2.zip --dir .local/b
          gh release download assets-v1 --pattern DEMO.zip --dir .local/b
      - name: Inspect and publish members
        run: |
          set -euo pipefail
          mkdir -p .local/r
          for z in .local/b/*.zip; do
            b=$(basename "$z" .zip)
            python3 tools/thinkdiag/inspect_pack.py "$z" --output ".local/r/$b"
          done
          python3 tools/thinkdiag/brand_summary.py .local/r
          {
            echo "## EOBD2 members"; echo
            python3 - <<'PY'
import json
for b in ("EOBD2","DEMO"):
    d=json.load(open(f".local/r/{b}/inspection.json"))
    print(f"### {b} ({d['bytes']} bytes, {d['entryCount']} entries, ext {d['extensions']})\n")
    print("| file | bytes | type | entropy |")
    print("| --- | ---: | --- | ---: |")
    for m in d["members"][:40]:
        print(f"| `{m['name']}` | {m['bytes']} | {m['type']} | {m['entropy']} |")
    print()
PY
          } > .local/r/members.md
          cat .local/r/members.md >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$GH_REPO/check-runs" \
            -f name='Brand member detail' -f head_sha="$GITHUB_SHA" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=EOBD2 + DEMO members' \
            -F 'output[summary]=@.local/r/members.md'
