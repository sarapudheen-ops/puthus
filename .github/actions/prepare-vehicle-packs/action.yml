name: Prepare on-demand Toyota vehicle packs
description: Convert the pinned source in Actions; put only the small hash-tree pin in the APK.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install pinned conversion and format-test dependencies
      shell: bash
      run: python3 -m pip install -r tools/thinkdiag/requirements.txt
    - uses: actions/cache@v5
      id: pack-cache
      with:
        path: .local/toyota-vehicle-packs
        key: toyota-vehicle-packs-v1-${{ runner.os }}-${{ hashFiles('tools/thinkdiag/*.py', 'tools/thinkdiag/requirements.txt', 'tools/thinkdiag/verification/*.json') }}
    - name: Convert the complete source on cache miss (never on the phone)
      if: steps.pack-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p .local/toyota-conversion
        gh release download assets-v1 --repo "$GITHUB_REPOSITORY" --pattern TOYOTA.zip --dir .local/toyota-conversion
        python3 tools/thinkdiag/source_verification.py .local/toyota-conversion/TOYOTA.zip
        python3 tools/thinkdiag/decode_toyota.py .local/toyota-conversion/TOYOTA.zip \
          --output .local/toyota-conversion/decoded --report .local/toyota-conversion/report
        python3 tools/thinkdiag/extract_english.py .local/toyota-conversion/TOYOTA.zip \
          --output .local/toyota-conversion/english --report .local/toyota-conversion/report
        python3 tools/thinkdiag/convert_vehicle_packs.py .local/toyota-conversion/TOYOTA.zip \
          --decoded .local/toyota-conversion/decoded --english .local/toyota-conversion/english \
          --manifest .local/toyota-conversion/report/decoded-manifest.json \
          --output .local/toyota-vehicle-packs
    - name: Verify even cached objects and stage only the small index for Android
      shell: bash
      run: |
        set -euo pipefail
        python3 tools/thinkdiag/verify_vehicle_bundle.py --directory .local/toyota-vehicle-packs
        mkdir -p .local/vehicle-pack-assets/toyota-vehicle-packs
        cp .local/toyota-vehicle-packs/index.json .local/vehicle-pack-assets/toyota-vehicle-packs/index.json
        test "$(find .local/vehicle-pack-assets -type f | wc -l)" -eq 1
